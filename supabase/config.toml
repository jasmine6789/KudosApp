# Supabase local development configuration.
# Docs: https://supabase.com/docs/guides/local-development/cli/config

project_id = "shoutout-board"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[inbucket]
enabled = false

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

[realtime]
enabled = false

[analytics]
enabled = false

# Edge Functions local runtime — required to run `supabase functions serve`.
[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.shoutouts]
verify_jwt = false
