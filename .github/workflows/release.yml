name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: "20"

jobs:
  verify:
    name: Verify (re-run gate before deploy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, test
        run: |
          npm run lint
          npm run typecheck
          npm run test:coverage

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Deno lint + test
        run: |
          deno lint supabase/functions/
          deno test --allow-env --allow-net supabase/functions/shoutouts/

  version-and-tag:
    name: Determine Version & Tag
    runs-on: ubuntu-latest
    needs: [verify]
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      changelog: ${{ steps.tag_version.outputs.changelog }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          generate_release_notes: true

  deploy-edge-function:
    name: Deploy Edge Function
    runs-on: ubuntu-latest
    needs: [version-and-tag]
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push database migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy shoutouts function
        run: supabase functions deploy shoutouts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  build-and-package-frontend:
    name: Build & Package Frontend
    runs-on: ubuntu-latest
    needs: [version-and-tag]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ needs.version-and-tag.outputs.new_tag }}
          path: dist/
          retention-days: 30

      # Replace with your actual static host deploy step, e.g.:
      #   - name: Deploy to Vercel
      #     run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
      #   - name: Deploy to Netlify
      #     run: npx netlify deploy --prod --dir=dist --auth=${{ secrets.NETLIFY_AUTH_TOKEN }}

  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [deploy-edge-function, build-and-package-frontend, version-and-tag]
    if: always()
    steps:
      - name: Report release outcome
        run: |
          TAG="${{ needs.version-and-tag.outputs.new_tag }}"
          FN_STATUS="${{ needs.deploy-edge-function.result }}"
          FE_STATUS="${{ needs.build-and-package-frontend.result }}"
          echo "Release $TAG, edge function: $FN_STATUS, frontend build: $FE_STATUS"
