name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  frontend:
    name: Frontend (lint, typecheck, test, coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit + integration tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 14

  edge-function:
    name: Edge Function (deno lint + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Deno lint
        run: deno lint supabase/functions/

      - name: Deno format check
        run: deno fmt --check supabase/functions/

      - name: Deno type check
        run: deno check supabase/functions/shoutouts/index.ts

      - name: Deno test
        run: deno test --allow-env --allow-net supabase/functions/shoutouts/

  db-migration-check:
    name: Supabase Migration Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase and apply migrations
        run: supabase start && supabase db reset

      - name: Regenerate types and check for drift
        run: |
          supabase gen types typescript --local > /tmp/database.types.ts
          if ! diff -q /tmp/database.types.ts src/types/database.types.ts > /dev/null 2>&1; then
            echo "::error::src/types/database.types.ts is out of date. Run 'supabase gen types typescript --local > src/types/database.types.ts' and commit the result."
            exit 1
          fi

      - name: Stop Supabase
        if: always()
        run: supabase stop

  build:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [frontend, edge-function]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [frontend, edge-function, db-migration-check, build]
    if: always()
    steps:
      - name: Fail if any dependency failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "One or more required jobs failed."
            exit 1
          fi
